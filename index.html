<meta name="apple-mobile-web-app-title" content="寶可夢圖鑑">

<title>寶可夢中英圖鑑 V2</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --text:#17181a; --muted:#717780; --line:#e5e7eb;
  --accent:#d93636; --accent-soft:#fff0f0; --chip:#f0f2f5; --shadow:0 2px 10px rgba(0,0,0,.05);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0f1012; --card:#191b1f; --text:#f6f7f9; --muted:#a5abb4; --line:#2b2e34;
    --accent:#f05a5a; --accent-soft:#351c1c; --chip:#24272d; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select{font:inherit}
.wrap{max-width:760px;margin:0 auto;padding:12px 12px 34px}
header{
  position:sticky;top:0;z-index:20;margin:0 -12px;padding:10px 12px 11px;
  background:color-mix(in srgb,var(--bg) 91%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid color-mix(in srgb,var(--line) 72%,transparent)
}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
h1{font-size:23px;line-height:1.15;margin:0;letter-spacing:-.02em}
.subtitle{font-size:12px;color:var(--muted);margin-top:4px}
.offline-btn{
  flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);
  border-radius:12px;padding:8px 10px;font-size:12px;font-weight:700
}
.offline-btn:disabled{opacity:.6}
.search{position:relative;margin-top:11px}
.search input{
  width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);
  border-radius:15px;padding:13px 44px 13px 15px;font-size:17px;outline:none;box-shadow:var(--shadow)
}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
.clear{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:34px;height:34px;border:0;border-radius:50%;background:var(--chip);color:var(--muted);
  font-size:20px;display:none
}
.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:9px}
.controls select,.fav-filter{
  min-width:0;border:1px solid var(--line);background:var(--card);color:var(--text);
  border-radius:11px;padding:8px 9px;font-size:13px
}
.fav-filter{font-weight:700;white-space:nowrap}
.fav-filter.active{background:var(--accent);border-color:var(--accent);color:#fff}
.status{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;margin-top:8px;padding:0 2px}
.list{display:grid;gap:9px;margin-top:11px}
.card{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;
  min-height:102px;padding:10px 10px;display:grid;grid-template-columns:86px 1fr 34px;
  align-items:center;gap:10px;box-shadow:var(--shadow)
}
.sprite-wrap{
  width:86px;height:82px;border-radius:13px;background:var(--chip);
  display:flex;align-items:center;justify-content:center;overflow:hidden
}
.sprite{width:80px;height:80px;object-fit:contain;image-rendering:auto}
.dex{color:var(--accent);font-weight:850;font-size:13px;font-variant-numeric:tabular-nums}
.zh{font-size:20px;font-weight:800;line-height:1.2;margin-top:1px}
.en{font-size:14px;color:var(--muted);margin-top:3px}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.badge{font-size:11px;font-weight:750;padding:4px 7px;border-radius:999px;background:var(--chip);color:var(--text)}
.gen{color:var(--muted);font-weight:650}
.star{
  align-self:start;margin-top:2px;border:0;background:transparent;color:#a0a5ad;
  width:34px;height:34px;font-size:25px;line-height:1;border-radius:50%
}
.star.on{color:#e0a800}
.empty{text-align:center;color:var(--muted);padding:58px 10px}
.progress{
  display:none;margin-top:8px;border-radius:10px;background:var(--card);border:1px solid var(--line);
  overflow:hidden;height:8px
}
.progress>div{width:0;height:100%;background:var(--accent);transition:width .15s linear}
.notice{font-size:11px;color:var(--muted);margin-top:6px;display:none}
footer{text-align:center;color:var(--muted);font-size:10px;line-height:1.55;padding:24px 12px 2px}
mark{background:transparent;color:var(--accent);font-weight:850}
@media(max-width:430px){
  .card{grid-template-columns:78px 1fr 31px;min-height:96px;padding:9px}
  .sprite-wrap{width:78px;height:76px}.sprite{width:74px;height:74px}
  .controls{grid-template-columns:1fr 1fr}.fav-filter{grid-column:1/3}
}
</style>
</head>

</footer>

en":9,"types":["電","龍"]},{"id":1022,"zh":"铁磐岩","en":"Iron Boulder","gen":9,"types":["岩石","超能力"]},{"id":1023,"zh":"铁头壳","en":"Iron Crown","gen":9,"types":["鋼","超能力"]},{"id":1024,"zh":"太樂巴戈斯","en":"Terapagos","gen":9,"types":["一般"]},{"id":1025,"zh":"桃歹郎","en":"Pecharunt","gen":9,"types":["毒","幽靈"]}];
const SPRITE_BASE='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/';
const IMAGE_CACHE='pokemon-images-v2';
const TYPES=['一般','格鬥','飛行','毒','地面','岩石','蟲','幽靈','鋼','火','水','草','電','超能力','冰','龍','惡','妖精'];

const q=document.getElementById('q');
const list=document.getElementById('list');
const count=document.getElementById('count');
const clear=document.getElementById('clear');
const genFilter=document.getElementById('genFilter');
const typeFilter=document.getElementById('typeFilter');
const favFilter=document.getElementById('favFilter');
const offlineBtn=document.getElementById('offlineBtn');
const progress=document.getElementById('progress');
const progressBar=progress.firstElementChild;
const notice=document.getElementById('notice');

let onlyFav=false;
let favorites=new Set(JSON.parse(localStorage.getItem('pokemon-favorites-v2')||'[]'));

for(const t of TYPES){
  const o=document.createElement('option');
  o.value=t;o.textContent=t;
  typeFilter.appendChild(o);
}

function spriteURL(id){ return `${SPRITE_BASE}${id}.png`; }
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function hi(text,term){
  if(!term || /^#?0*\d+$/.test(term)) return esc(text);
  const lo=text.toLocaleLowerCase(), t=term.toLocaleLowerCase(), i=lo.indexOf(t);
  if(i<0)return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+term.length))+'</mark>'+esc(text.slice(i+term.length));
}
function matches(p,term){
  const t=term.trim().toLocaleLowerCase();
  if(!t)return true;
  if(/^#?0*\d+$/.test(t))return p.id===Number(t.replace('#',''));
  return p.zh.toLocaleLowerCase().includes(t) ||
         p.en.toLocaleLowerCase().includes(t) ||
         p.types.some(x=>x.toLocaleLowerCase().includes(t));
}
function saveFav(){ localStorage.setItem('pokemon-favorites-v2',JSON.stringify([...favorites])); }
function toggleFav(id){
  favorites.has(id)?favorites.delete(id):favorites.add(id);
  saveFav(); render();
}
window.toggleFav=toggleFav;

function render(){
  const term=q.value.trim();
  const gen=Number(genFilter.value);
  const type=typeFilter.value;
  const rows=POKEMON.filter(p=>
    (!gen||p.gen===gen) &&
    (!type||p.types.includes(type)) &&
    (!onlyFav||favorites.has(p.id)) &&
    matches(p,term)
  );
  count.textContent=`${rows.length} / ${POKEMON.length} 隻`;
  clear.style.display=term?'block':'none';
  if(!rows.length){
    list.innerHTML='<div class="empty">找不到符合條件的寶可夢</div>';
    return;
  }
  list.innerHTML=rows.map(p=>`
    <article class="card">
      <div class="sprite-wrap">
        <img class="sprite" loading="lazy" decoding="async"
             src="${spriteURL(p.id)}" alt="${esc(p.zh)}"
             onerror="this.style.opacity='.18'">
      </div>
      <div>
        <div class="dex">#${String(p.id).padStart(4,'0')}</div>
        <div class="zh">${hi(p.zh,term)}</div>
        <div class="en">${hi(p.en,term)}</div>
        <div class="meta">
          ${p.types.map(t=>`<span class="badge">${hi(t,term)}</span>`).join('')}
          <span class="badge gen">Gen ${p.gen}</span>
        </div>
      </div>
      <button class="star ${favorites.has(p.id)?'on':''}" onclick="toggleFav(${p.id})"
              aria-label="${favorites.has(p.id)?'取消收藏':'加入收藏'}">${favorites.has(p.id)?'★':'☆'}</button>
    </article>`).join('');
}

q.addEventListener('input',render);
clear.addEventListener('click',()=>{q.value='';q.focus();render();});
genFilter.addEventListener('change',render);
typeFilter.addEventListener('change',render);
favFilter.addEventListener('click',()=>{
  onlyFav=!onlyFav;
  favFilter.classList.toggle('active',onlyFav);
  favFilter.textContent=onlyFav?'★ 收藏中':'☆ 只看收藏';
  render();
});

async function cachedImageCount(){
  if(!('caches' in window)) return 0;
  const cache=await caches.open(IMAGE_CACHE);
  const keys=await cache.keys();
  return keys.filter(x=>x.url.includes('/sprites/pokemon/')).length;
}
async function updateOfflineLabel(){
  try{
    const n=await cachedImageCount();
    offlineBtn.textContent=n>=1025?'✓ 圖片已離線':(n>0?`離線圖片 ${n}/1025`:'下載離線圖片');
  }catch(e){}
}

async function downloadAllImages(){
  if(!window.isSecureContext || !('caches' in window)){
    notice.style.display='block';
    notice.textContent='離線圖片下載需要從 HTTPS 網址開啟這個 PWA。';
    return;
  }
  offlineBtn.disabled=true;
  progress.style.display='block';
  notice.style.display='block';
  const cache=await caches.open(IMAGE_CACHE);
  let done=0, failed=0;
  const ids=POKEMON.map(p=>p.id);
  const worker=async()=>{
    while(ids.length){
      const id=ids.shift();
      const url=spriteURL(id);
      try{
        const hit=await cache.match(url);
        if(!hit){
          const res=await fetch(url,{mode:'cors',cache:'no-cache'});
          if(!res.ok) throw new Error(res.status);
          await cache.put(url,res.clone());
        }
      }catch(e){ failed++; }
      done++;
      progressBar.style.width=`${done/1025*100}%`;
      notice.textContent=`正在準備離線圖片：${done}/1025${failed?`（失敗 ${failed}）`:''}`;
    }
  };
  await Promise.all(Array.from({length:6},worker));
  offlineBtn.disabled=false;
  if(failed===0){
    notice.textContent='完成。現在圖片也可以離線顯示。';
  }else{
    notice.textContent=`完成，但有 ${failed} 張下載失敗；有網路時再按一次即可補齊。`;
  }
  await updateOfflineLabel();
}
offlineBtn.addEventListener('click',downloadAllImages);

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
render();
updateOfflineLabel();
</script>
